{% extends "base/base.html" %}

{% block page_title %}مخطط جانت التفاعلي{% endblock %}
{% block page_subtitle %}متابعة زمنية تفاعلية لمهام OPAL ERP{% endblock %}

{% block content %}



<div class="gantt-page">
  <div class="opal-card p-4 mb-4">
    <h3>📅 مخطط جانت التفاعلي</h3>
    <p class="text-muted mb-0">يعرض المهام حسب البداية والنهاية والحالة ونسبة الإنجاز.</p>
  </div>

  <div class="gantt-card gantt-controls">
    <div>
      <button onclick="setZoom(42)">تصغير</button>
      <button onclick="setZoom(54)">عادي</button>
      <button onclick="setZoom(72)">تكبير</button>
    </div>
    <input id="ganttSearch" placeholder="ابحث عن مهمة..." oninput="renderGantt()">
  </div>

  <div class="gantt-card">
    <div id="ganttStatus">جاري تحميل البيانات...</div>
    <div id="ganttBox" class="gantt-wrap opal-inline-r124-7">
      <div id="ganttGrid" class="gantt-grid"></div>
    </div>
  </div>
</div>

<div id="ganttPopup" class="gantt-popup"></div>

<script>
let rawTasks = [];
let dayWidth = 54;

const statusLabel = {
  todo: "لم يبدأ",
  doing: "قيد التنفيذ",
  review: "قيد المراجعة",
  done: "مكتملة"
};

function parseDate(v){
  if(!v) return null;
  const d = new Date(String(v).slice(0,10));
  return isNaN(d) ? null : d;
}

function fmt(d){
  return d.toLocaleDateString("ar-JO",{month:"short",day:"numeric"});
}

function daysBetween(a,b){
  return Math.round((b-a)/(1000*60*60*24));
}

function setZoom(w){
  dayWidth = w;
  renderGantt();
}

function showPopup(e,t){
  const p=document.getElementById("ganttPopup");
  p.innerHTML = `
    <h4>${t.title}</h4>
    <div>الحالة: ${t.statusText}</div>
    <div>نسبة الإنجاز: ${t.progress}%</div>
    <div>البداية: ${t.startText}</div>
    <div>النهاية: ${t.endText}</div>
    <div>الوحدة: ${t.module || "-"}</div>
  `;
  p.style.display="block";
  p.style.left=(e.clientX-260)+"px";
  p.style.top=(e.clientY+15)+"px";
}

document.addEventListener("click",function(e){
  if(!e.target.classList.contains("gantt-bar")){
    document.getElementById("ganttPopup").style.display="none";
  }
});

function renderGantt(){
  const q = document.getElementById("ganttSearch").value.trim().toLowerCase();

  const tasks = rawTasks.filter(t =>
    !q || t.title.toLowerCase().includes(q) || String(t.module || "").toLowerCase().includes(q)
  );

  const status = document.getElementById("ganttStatus");
  const box = document.getElementById("ganttBox");
  const grid = document.getElementById("ganttGrid");

  if(!tasks.length){
    status.style.display="block";
    box.style.display="none";
    status.innerHTML="لا توجد مهام مطابقة للعرض.";
    return;
  }

  const minDate = new Date(Math.min(...tasks.map(t=>t.start)));
  const maxDate = new Date(Math.max(...tasks.map(t=>t.end)));
  const totalDays = Math.max(daysBetween(minDate,maxDate)+1,1);

  let html = `<div class="gantt-head"><div></div><div class="gantt-days">`;
  for(let i=0;i<totalDays;i++){
    const d=new Date(minDate);
    d.setDate(d.getDate()+i);
    html += `<div class="gantt-day" style="width:${dayWidth}px">${fmt(d)}</div>`;
  }
  html += `</div></div>`;

  tasks.forEach((t,idx)=>{
    const offset=Math.max(daysBetween(minDate,t.start),0);
    const duration=Math.max(daysBetween(t.start,t.end)+1,1);
    const overdue = t.end < new Date() && t.status !== "done";
    const cls = overdue ? "overdue" : (t.status || "todo");

    html += `
      <div class="gantt-row">
        <div class="gantt-title" title="${t.title}">${t.title}</div>
        <div class="gantt-line">
          <div class="gantt-bar ${cls}"
            data-index="${idx}"
            style="right:${offset*dayWidth}px;width:${duration*dayWidth}px"
            onclick="showPopup(event, rawTasks.find(x=>x.id==${t.id}))">
            ${t.progress}% — ${t.title}
          </div>
        </div>
      </div>`;
  });

  status.style.display="none";
  box.style.display="block";
  grid.innerHTML=html;
}

fetch("/development/gantt/data/", {credentials:"same-origin"})
.then(r=>r.json())
.then(data=>{
  const rows = Array.isArray(data) ? data : (data.tasks || []);
  rawTasks = rows.map(t=>{
    const start = parseDate(t.start_date || t.start);
    const end = parseDate(t.due_date || t.end_date || t.end);
    return {
      id:t.id,
      title:t.title || t.name || "مهمة",
      module:t.module || "",
      status:t.status || "todo",
      statusText:t.status_label || statusLabel[t.status] || t.status || "لم يبدأ",
      progress:Number(t.progress || 0),
      start,
      end,
      startText:t.start_date || t.start || "-",
      endText:t.due_date || t.end_date || t.end || "-"
    };
  }).filter(t=>t.start && t.end);

  renderGantt();
})
.catch(err=>{
  document.getElementById("ganttStatus").innerHTML="تعذر تحميل بيانات مخطط جانت.";
  console.error(err);
});
</script>

{% endblock %}
